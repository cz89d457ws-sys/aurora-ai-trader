services:
  - type: web
    name: aurora-ai-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: AURORA_DB
        value: /tmp/aurora.db
      - key: AUTO_PAPER_DEFAULT
        value: "true"
      - key: AUTO_INTERVAL_SECONDS
        value: "60"
      - key: MAX_TRADE_EUR
        value: "200"
      - key: MAX_OPEN_MARKETS
        value: "10"
      - key: AURORA_USERNAME
        sync: false
      - key: AURORA_PASSWORD
        sync: false
